  <text x="780" y="100" transform="rotate(-12, 1000, 100)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="-80" y="280" transform="rotate(-12, 200, 280)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="350" y="280" transform="rotate(-12, 600, 280)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="780" y="280" transform="rotate(-12, 1000, 280)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="-80" y="540" transform="rotate(-12, 200, 540)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="350" y="540" transform="rotate(-12, 600, 540)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="780" y="540" transform="rotate(-12, 1000, 540)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="-80" y="720" transform="rotate(-12, 200, 720)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="350" y="720" transform="rotate(-12, 600, 720)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>
  <text x="780" y="720" transform="rotate(-12, 1000, 720)" font-family="Arial Black,sans-serif" font-size="64" font-weight="900" font-style="italic" fill="rgba(10,10,10,0.07)" letter-spacing="0.02em">24-7 MARKETS</text>

  <!-- 24-7: thick black outline layer (rendered first = behind) -->
  <text x="600" y="408" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="380" font-weight="900" font-style="italic" fill="none" stroke="#0a0a0a" stroke-width="20" stroke-linejoin="round" letter-spacing="-0.03em">24-7</text>
  <!-- 24-7: black offset shadow -->
  <text x="614" y="422" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="380" font-weight="900" font-style="italic" fill="#0a0a0a" letter-spacing="-0.03em">24-7</text>
  <!-- 24-7: white fill on top -->
  <text x="600" y="408" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="380" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="-0.03em">24-7</text>

  <!-- MARKETS: black offset shadow -->
  <text x="608" y="548" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="130" font-weight="900" font-style="italic" fill="#0a0a0a" letter-spacing="0.06em">MARKETS</text>
  <!-- MARKETS: white fill on top -->
  <text x="600" y="540" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="130" font-weight="900" font-style="italic" fill="#ffffff" letter-spacing="0.06em">MARKETS</text>

  <!-- Powered by badge -->
  <rect x="395" y="590" width="410" height="64" fill="#0a0a0a"/>
